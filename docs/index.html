<script>

window.SITE = {

};
(function () {
  const S = window.SITE;
  document.getElementById("nav-demos").href = S.repoUrl + "/tree/main/demos";
  document.getElementById("nav-exercises").href = S.repoUrl + "/tree/main/exercises";
  document.getElementById("rail-repo").href = S.repoUrl;
  document.getElementById("rail-feedback").href = S.feedbackFormUrl;

  const DOW = ["Mon", "Tue", "Wed", "Thu", "Fri"];
  const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  // ISO "YYYY-MM-DD" -> parts, without going through Date() (no timezone shift).
  const parts = iso => { const [y, m, d] = iso.split("-").map(Number); return { y, m, d }; };
  const dowOf = iso => { const p = parts(iso); return DOW[(new Date(Date.UTC(p.y, p.m - 1, p.d)).getUTCDay() + 6) % 7] || ""; };
  const fmtDay = iso => { const p = parts(iso); return `${dowOf(iso)} ${MON[p.m - 1]} ${p.d}`; };
  const fmtRange = (a, b) => { const p = parts(a), q = parts(b); return p.m === q.m ? `${MON[p.m - 1]} ${p.d}–${q.d}` : `${MON[p.m - 1]} ${p.d} – ${MON[q.m - 1]} ${q.d}`; };
  // "Today" in the cohort's timezone, as ISO, so the highlight is right wherever the page is opened.
  let today = "";
  try {
    today = new Intl.DateTimeFormat("en-CA", { timeZone: (window.CAL || {}).timezone || "America/Toronto", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
  } catch (e) { today = new Date().toISOString().slice(0, 10); }
  const legend = document.querySelector(".legend");
  Object.values(window.PHASES).forEach(p => {
    const s = document.createElement("span"); s.className = "lg";
    s.innerHTML = `<i style="background:${p.c}"></i>${p.label}`; legend.appendChild(s);
  });
  const cal = document.getElementById("cal");
  const cell = (cls, txt) => { const d = document.createElement("div"); d.className = cls; d.textContent = txt; return d; };
  cal.appendChild(cell("cal-corner", ""));
  DOW.forEach(d => cal.appendChild(cell("cal-dayhead", d)));

  window.WEEKS.forEach(week => {
    const ph = window.PHASES[week.phase] || { label: "", c: "#888" };
    const proj = (window.PROJECTS[week.project] || {}).label || week.project || "";
    const wc = document.createElement("div");
    wc.className = "cal-week"; wc.style.setProperty("--pc", ph.c);
    const range = (week.start && week.end) ? `<div class="wd">${fmtRange(week.start, week.end)}</div>` : "";
    wc.innerHTML = `<div class="ww">Week ${week.w}</div>${range}<div class="wt">${week.title}</div><div class="wp">${ph.label}</div><div class="proj-band">${proj}</div>`;
    cal.appendChild(wc);
    week.days.forEach(day => {
      const dateLine = day.date ? `<div class="cd">${fmtDay(day.date)}</div>` : "";
      const isToday = !!day.date && day.date === today;
      if (day.kind === "holiday") {
        const el = document.createElement("div");
        el.className = "cal-cell holiday" + (isToday ? " today" : "");
        el.innerHTML = `${dateLine}<div class="ct">${day.label || "Holiday"}</div><div class="cs">No class</div>`;
        cal.appendChild(el);
        return;
      }
      const live = !!day.href;
      const title = live ? `<a class="ct-link" href="${day.href}">${day.t}</a>` : day.t;
      const marks = (day.review ? '<span class="mk star">★</span>' : '') + (day.feedback ? '<span class="mk">📝</span>' : '');
      let chips = "";
      if (live) {
        chips += `<a class="chip" href="${day.href}">Notes</a>`;
        if (day.demo) chips += `<a class="chip" href="${day.demo}" target="_blank" rel="noopener">Demo</a>`;
        if (day.ex) chips += `<a class="chip" href="${day.ex}" target="_blank" rel="noopener">Exercise</a>`;
      } else {
        chips += `<span class="chip soon">coming soon</span>`;
      }
      const el = document.createElement("div");
      el.className = "cal-cell" + (live ? " live" : " soon") + (isToday ? " today" : "");
      el.style.setProperty("--pc", ph.c);
      el.innerHTML =
        `${dateLine}<div class="ct">${title}</div><div class="cs">${day.s || ""}</div>` +
        `<div class="cell-foot">` +
          (marks ? `<div class="ritual-row">${marks}</div>` : "") +
          `<div class="cell-chips">${chips}</div>` +
        `</div>`;
      cal.appendChild(el);
    });
  });
})();
</script>
