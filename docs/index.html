<script>
// Site-level links. Keep in sync with harness/config.json (build_index.py does not touch these).
window.SITE = {
  repoUrl: "https://github.com/2494-Gen-AI-CN/training",
  feedbackFormUrl: "https://REPLACE_ME.example/feedback"
};
(function () {
  const S = window.SITE;
  document.getElementById("nav-demos").href = S.repoUrl + "/tree/main/demos";
  document.getElementById("nav-exercises").href = S.repoUrl + "/tree/main/exercises";
  document.getElementById("rail-repo").href = S.repoUrl;
  document.getElementById("rail-feedback").href = S.feedbackFormUrl;

  const DOW = ["Mon", "Tue", "Wed", "Thu", "Fri"];
  const legend = document.querySelector(".legend");
  Object.values(window.PHASES).forEach(p => {
    const s = document.createElement("span"); s.className = "lg";
    s.innerHTML = `<i style="background:${p.c}"></i>${p.label}`; legend.appendChild(s);
  });
  const cal = document.getElementById("cal");
  const cell = (cls, txt) => { const d = document.createElement("div"); d.className = cls; d.textContent = txt; return d; };
  cal.appendChild(cell("cal-corner", ""));
  DOW.forEach(d => cal.appendChild(cell("cal-dayhead", d)));

  window.WEEKS.forEach(week => {
    const ph = window.PHASES[week.phase] || { label: "", c: "#888" };
    const proj = (window.PROJECTS[week.project] || {}).label || week.project || "";
    const wc = document.createElement("div");
    wc.className = "cal-week"; wc.style.setProperty("--pc", ph.c);
    wc.innerHTML = `<div class="ww">Week ${week.w}</div><div class="wt">${week.title}</div><div class="wp">${ph.label}</div><div class="proj-band">${proj}</div>`;
    cal.appendChild(wc);
    week.days.forEach(day => {
      const live = !!day.href;
      const title = live ? `<a class="ct-link" href="${day.href}">${day.t}</a>` : day.t;
      const marks = (day.review ? '<span class="mk star">★</span>' : '') + (day.feedback ? '<span class="mk">📝</span>' : '');
      let chips = "";
      if (live) {
        chips += `<a class="chip" href="${day.href}">Notes</a>`;
        if (day.demo) chips += `<a class="chip" href="${day.demo}" target="_blank" rel="noopener">Demo</a>`;
        if (day.ex) chips += `<a class="chip" href="${day.ex}" target="_blank" rel="noopener">Exercise</a>`;
      } else {
        chips += `<span class="chip soon">coming soon</span>`;
      }
      const el = document.createElement("div");
      el.className = "cal-cell" + (live ? " live" : " soon");
      el.style.setProperty("--pc", ph.c);
      el.innerHTML =
        `<div class="ct">${title}</div><div class="cs">${day.s || ""}</div>` +
        `<div class="cell-foot">` +
          (marks ? `<div class="ritual-row">${marks}</div>` : "") +
          `<div class="cell-chips">${chips}</div>` +
        `</div>`;
      cal.appendChild(el);
    });
  });
})();
</script>
